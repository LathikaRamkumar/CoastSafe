services:
  mongo:
    image: mongo:7
    container_name: coastsafe-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/beach_tourism_portal
      JWT_SECRET: change_this_secret
      CLIENT_URL: http://localhost:5173
    ports: ["5000:5000"]
    depends_on: [mongo]
volumes:
  mongo_data:
